name: Build Shivam Network Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: android
        run: gradle assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ShivamNetwork.apk

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Shivam Network Android App v1.0.0
          body: |
            Shivam Network Android app.
            Install this APK on Android phones. It connects to the live Shivam Network website and admin backend.
          files: ShivamNetwork.apk
          make_latest: true
          fail_on_unmatched_files: true
