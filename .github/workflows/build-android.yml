name: Build Shivam Network Android APK and AAB

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/shivam-network-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js and run storefront checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies and test storefront
        run: |
          npm install
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare release signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed release APK and AAB
        working-directory: android
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify APK and AAB packages and signatures
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          test "$(stat -c%s "$APK")" -gt 10000
          test "$(stat -c%s "$AAB")" -gt 10000
          unzip -t "$APK"
          unzip -t "$AAB"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.shivamnetwork.app' versionCode='8' versionName='1.0.7'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          jarsigner -verify "$AAB"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
          unzip -l "$AAB" | grep -E 'BundleConfig.pb|base/manifest/AndroidManifest.xml'
          mkdir -p release
          cp "$APK" release/ShivamNetwork-1.0.7-release.apk
          cp "$AAB" release/ShivamNetwork-1.0.7-release.aab
          sha256sum release/ShivamNetwork-1.0.7-release.apk release/ShivamNetwork-1.0.7-release.aab > release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload signed APK and AAB for direct download
        uses: actions/upload-artifact@v4
        with:
          name: ShivamNetwork-APK-AAB-v1.0.7-release
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK and AAB downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: Shivam Network Android App v1.0.7
          body: |
            Shivam Network Android release v1.0.7.
            Includes a signed APK for direct installation and a signed AAB for Google Play submission.
            Verify both files using SHA256SUMS.txt.
          files: |
            release/ShivamNetwork-1.0.7-release.apk
            release/ShivamNetwork-1.0.7-release.aab
            release/SHA256SUMS.txt
          make_latest: true
          fail_on_unmatched_files: true
