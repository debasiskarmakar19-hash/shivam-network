name: Build Shivam Network Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package, contents and signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -F "package: name='com.shivamnetwork.app'"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
          mkdir -p release
          cp "$APK" release/ShivamNetwork.apk
          sha256sum release/ShivamNetwork.apk > release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload APK for direct download
        uses: actions/upload-artifact@v4
        with:
          name: ShivamNetwork-APK-v1.0.1
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: Shivam Network Android App v1.0.1
          body: |
            Shivam Network Android app — verified debug-signed APK for Android installation and testing.
            Direct APK: https://github.com/debasiskarmakar19-hash/shivam-network/releases/download/v1.0.1/ShivamNetwork.apk
            SHA-256 checksum is included as SHA256SUMS.txt.
            This is a test/distribution APK, not a Google Play production-signed release.
          files: |
            release/ShivamNetwork.apk
            release/SHA256SUMS.txt
          make_latest: true
          fail_on_unmatched_files: true
