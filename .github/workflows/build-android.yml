name: Build Shivam Network Android Release APK

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/shivam-network-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js and run storefront checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies and test storefront
        run: |
          npm install
          npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify release APK package, contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.shivamnetwork.app' versionCode='7' versionName='1.0.6'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
          mkdir -p release
          cp "$APK" release/ShivamNetwork-1.0.6-release.apk
          sha256sum release/ShivamNetwork-1.0.6-release.apk > release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload signed APK for direct download
        uses: actions/upload-artifact@v4
        with:
          name: ShivamNetwork-APK-v1.0.6-release
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Shivam Network Android App v1.0.6
          body: |
            Shivam Network Android app — release-signed APK.
            Verify the APK using the SHA-256 checksum in SHA256SUMS.txt.
          files: |
            release/ShivamNetwork-1.0.6-release.apk
            release/SHA256SUMS.txt
          make_latest: true
          fail_on_unmatched_files: true
